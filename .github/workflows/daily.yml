name: Actualización diaria y despliegue
on:
  schedule:
    - cron: "30 22 * * 1-5"   # tras el cierre de EE. UU. (UTC)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_data.py
      - name: Guardar datos
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "Datos de mercado $(date -u +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
