name: Reto 60 · APK
on:
  push:
    paths: ["reto-60/**", ".github/workflows/reto60-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reto-60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk ../Reto60-v${{ github.run_number }}.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reto60-v${{ github.run_number }}
          name: "Reto 60 · versión ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Descarga el archivo **Reto60-v${{ github.run_number }}.apk** desde tu teléfono e instálalo."
          files: Reto60-v${{ github.run_number }}.apk
