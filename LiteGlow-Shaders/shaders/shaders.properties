# LiteGlow - shaders ligeros con sombras, luz dinamica y luz natural
screen=<profile> <empty> [SHADOW_S] [LIGHT_S] [IMAGE_S]
screen.SHADOW_S=SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation
screen.LIGHT_S=DYNAMIC_LIGHTS BLOCKLIGHT_STRENGTH AMBIENT_STRENGTH
screen.IMAGE_S=WAVING FOG_AMOUNT EXPOSURE SATURATION
sliders=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation BLOCKLIGHT_STRENGTH AMBIENT_STRENGTH FOG_AMOUNT EXPOSURE SATURATION

profile.POTATO=!SHADOWS !WAVING DYNAMIC_LIGHTS FOG_AMOUNT=0.5
profile.LOW=SHADOWS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SAMPLES=4 SHADOW_SOFTNESS=1.0 DYNAMIC_LIGHTS WAVING
profile.MEDIUM=SHADOWS shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=6 SHADOW_SOFTNESS=1.5 DYNAMIC_LIGHTS WAVING
profile.HIGH=SHADOWS shadowMapResolution=3072 shadowDistance=128.0 SHADOW_SAMPLES=8 SHADOW_SOFTNESS=2.0 DYNAMIC_LIGHTS WAVING
